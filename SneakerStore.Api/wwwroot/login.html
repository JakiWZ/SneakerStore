<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SneakerStore — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1><a href="index.html" style="text-decoration:none;color:inherit;">SneakerStore</a></h1>
    </div>
    <div class="barcode on-dark"></div>
  </header>

  <main>
    <span class="eyebrow">Access</span>
    <h2>Sign In</h2>

    <div class="barcode" style="max-width:420px;margin:20px auto 0;"></div>

    <form id="loginForm">
      <h2>Log In</h2>
      <input type="text" id="loginUsername" placeholder="Username" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit" class="btn-primary">Log in</button>
      <p id="loginError" class="error"></p>
    </form>

    <form id="registerForm">
      <h2>Register</h2>
      <input type="text" id="registerUsername" placeholder="Username" required />
      <input type="password" id="registerPassword" placeholder="Password (min 6 chars, 1 uppercase, 1 number)" pattern="(?=.*[A-Z])(?=.*[0-9]).{6,}" title="At least 6 characters, one uppercase letter and one number" required />
      <button type="submit" class="btn-secondary">Create account</button>
      <p id="registerError" class="error"></p>
    </form>

    <form id="createAdminForm" class="hidden clearance">
      <h2>Create Admin account</h2>
      <input type="text" id="adminUsername" placeholder="Username" required />
      <input type="password" id="adminPassword" placeholder="Password (min 6 chars, 1 uppercase, 1 number)" pattern="(?=.*[A-Z])(?=.*[0-9]).{6,}" title="At least 6 characters, one uppercase letter and one number" required />
      <button type="submit" class="btn-secondary">Create Admin</button>
      <p id="adminError" class="error"></p>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("loginError");
      errorEl.textContent = "";
      try {
        await login(
          document.getElementById("loginUsername").value,
          document.getElementById("loginPassword").value
        );
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("registerError");
      errorEl.textContent = "";
      try {
        await register(
          document.getElementById("registerUsername").value,
          document.getElementById("registerPassword").value
        );
        errorEl.textContent = "Account created, please log in.";
        errorEl.style.color = "#3c6bff";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    const createAdminForm = document.getElementById("createAdminForm");
    if (isAdmin()) createAdminForm.classList.remove("hidden");

    createAdminForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("adminError");
      errorEl.textContent = "";
      try {
        await createAdmin(
          document.getElementById("adminUsername").value,
          document.getElementById("adminPassword").value
        );
        errorEl.textContent = "Admin account created.";
        errorEl.style.color = "#3c6bff";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
