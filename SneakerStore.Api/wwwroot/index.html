<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SneakerStore — Catalog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1><a href="index.html" style="text-decoration:none;color:inherit;">SneakerStore</a></h1>
      <nav id="nav"></nav>
    </div>
    <div class="barcode on-dark"></div>
  </header>

  <main>
    <span class="eyebrow">Inventory</span>
    <h2>Current Stock</h2>

    <section id="adminAddSection" class="hidden">
      <h2>Manage product</h2>
      <form id="sneakerForm">
        <input type="hidden" id="formId" />
        <input type="text" id="formName" placeholder="Name" required />
        <input type="text" id="formBrand" placeholder="Brand" required />
        <input type="text" id="formModel" placeholder="Model" required />
        <input type="text" id="formSize" placeholder="Size" required />
        <input type="number" id="formQuantity" placeholder="Quantity available" min="0" required />
        <input type="number" id="formPrice" placeholder="Price" min="0" step="0.01" required />
        <button type="submit" class="btn-primary">Save</button>
      </form>
    </section>

    <div id="catalogGrid" class="grid"></div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
